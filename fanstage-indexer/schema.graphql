# Artist Token Events (ERC20 Transfer events from dynamically created ArtistToken contracts)

type ArtistToken_Transfer {
  id: ID! # Format: {chainId}_{blockNumber}_{logIndex}

  # Event Parameters (ERC20 Transfer)
  from: String! # Sender address (indexed, lowercase) - 0x0 for minting
  to: String! # Recipient address (indexed, lowercase) - 0x0 for burning  
  value: BigInt! # Token amount transferred (2 decimals for IDRX)

  # Contract Context
  artistToken: String! # ArtistToken contract address
  campaignContract: String # Associated campaign contract (derived)
  campaignId: BigInt # Campaign ID (derived from campaign lookup)

  # Token Information (enriched from contract calls)
  tokenName: String # Token name (e.g., "FANETIC-RIZKY")
  tokenSymbol: String # Token symbol (e.g., "FANT-FANETIC-RIZKY")

  # Event Metadata
  blockNumber: BigInt! # Block number
  blockTimestamp: BigInt! # Unix timestamp
  transactionHash: String! # Transaction hash
}

